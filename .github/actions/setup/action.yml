name: 'Setup and install'
description: 'Common setup steps for CI (bun + deps + dummy env)'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - uses: oven-sh/setup-bun@v2

    - shell: bash
      run: bun install --frozen-lockfile

    - name: Create environment variables file
      shell: bash
      run: |
        cat << 'EOF' > .env
        SLACK_BOT_TOKEN=xoxb-dummy
        SLACK_APP_TOKEN=xapp-dummy
        SLACK_USER_TOKEN=xoxp-dummy
        OWNER_USER_ID=U0123456789
        COMMANDCODE_API_KEY=dummy
        DATABASE_URL=postgresql://user:pass@localhost:5432/db
        MASTRA_PLATFORM_ACCESS_TOKEN=dummy
        MASTRA_PROJECT_ID=dummy
        EOF
