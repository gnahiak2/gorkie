name: gorkie

services:
  gorkie:
    build:
      context: .
      dockerfile: Dockerfile
    image: gorkie:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override .env, which points at a local database and development mode.
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gorkie
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sandbox:/app/.sandbox
    # Socket Mode dials out, so no inbound port is required. The Mastra API is
    # exposed on loopback only; remove this block if it is not needed.
    ports:
      - "127.0.0.1:4111:4111"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gorkie
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gorkie"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sandbox:
  pgdata:
